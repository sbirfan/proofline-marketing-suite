[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "proofline-marketing-suite"
version = "2.1.0"
description = "Evidence-first marketing audits for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Syed Irfan" }]
keywords = ["marketing", "audit", "seo", "claude-code", "cro"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.48"]
reports = ["reportlab>=4.2,<5"]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "mypy>=1.13",
  "pypdf>=5.1",
  "PyYAML>=6.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "reportlab>=4.2,<5",
  "ruff>=0.8",
  "types-reportlab>=4.2",
]

[project.scripts]
proofline = "proofline_marketing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/proofline_marketing"]

[tool.hatch.build]
exclude = [
  "/.coverage",
  "/.mypy_cache",
  "/.package-smoke",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/build",
  "/build-env-*",
  "/build-requirements-*.txt",
  "/build-via-sdist-*",
  "/dist",
  "/pip-*",
  "/pytest-of-root",
  "/tmp*",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["pip-build-env-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["proofline_marketing"]

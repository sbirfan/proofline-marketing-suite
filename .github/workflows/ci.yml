name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=svgai_marketing --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python scripts/validate_release.py
      - run: python -m build
      - run: python -m venv .package-smoke
      - run: .package-smoke/bin/python -m pip install dist/*.whl
      - run: .package-smoke/bin/svgai-marketing --help
      - run: .package-smoke/bin/svgai-marketing doctor --json
      - run: .package-smoke/bin/python -m pip install ".[browser]"
      - run: .package-smoke/bin/python -c "from playwright.sync_api import sync_playwright; assert sync_playwright"
      - run: .package-smoke/bin/python -m pip install ".[reports]"
      - run: .package-smoke/bin/python -c "from reportlab.pdfgen import canvas; assert canvas"
